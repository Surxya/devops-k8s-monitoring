replicaCount: 2

image:
  repository: surxya/devops-demo-app
  tag: "1.0"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 30080

config:
  APP_ENV: dev
  JAVA_OPTS: "-Xms128m -Xmx256m"

secret:
  APP_API_KEY: change-me

probes:
  readiness:
    path: /health
    initialDelaySeconds: 20
    periodSeconds: 5
  liveness:
    path: /health
    initialDelaySeconds: 40
    periodSeconds: 10

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
